targets:
  $default:
    sources:
      # example 是独立的 Flutter 应用包，桌面平台构建时会在其
      # windows/flutter/ephemeral/.plugin_symlinks 下生成指向 pub 缓存与插件自身的
      # 符号链接，build_runner 会沿链接把第三方插件的测试文件当作本包源码处理，
      # 因注解（如 @GenerateMocks）无法在本包依赖中解析而导致构建失败，故整体排除
      exclude:
        - example/**
    builders:
      json_serializable:
        options:
          # Options configure how source code is generated for every
          # `@JsonSerializable`-annotated class in the package.
          #
          # The default value for each is listed.
          #
          # For details on the meaning of each option, see the documentation
          # for the corresponding field in the `JsonSerializable` class.
          # 忽略所有值为 null 的字段
          include_if_null: false