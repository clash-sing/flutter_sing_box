# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart CI & Publish

on:
  push:
#    branches: [ "main" ]
    tags: [ "v*" ]
#  pull_request:
#    branches: [ "main" ]
#  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze --fatal-infos
      - name: Run tests
        run: flutter test

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # 调用方必须先授权，被调用的官方 workflow 内部的 id-token: write 才能生效
    permissions:
      id-token: write # 允许官方发布 workflow 换取 OIDC 令牌
    # 官方发布 workflow：内部完成 checkout、OIDC 令牌 provision、
    # Flutter SDK 装载、dart pub get、dry-run 校验与 dart pub publish -f
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
