proxies:
  - {name: TJ-A, type: trojan, server: t1.example.com, port: 443, password: pw, sni: t1.example.com, skip-cert-verify: false}
  - {name: TJ-B, type: trojan, server: t2.example.com, port: 443, password: pw, sni: t2.example.com, skip-cert-verify: false}
  - {name: TJ-H2, type: trojan, server: t3.example.com, port: 443, password: pw, udp: true, skip-cert-verify: false, sni: t3.example.com, network: h2, h2-opts: {path: /h2, host: [t3.example.com]}}
proxy-groups:
  - {name: PROXY, type: select, proxies: [TJ-A, TJ-B, TJ-H2]}
