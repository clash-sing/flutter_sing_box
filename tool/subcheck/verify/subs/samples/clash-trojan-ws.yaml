proxies:
  - {name: TJ-A, type: trojan, server: t1.example.com, port: 443, password: pw, sni: t1.example.com, skip-cert-verify: false}
  - {name: TJ-B, type: trojan, server: t2.example.com, port: 443, password: pw, sni: t2.example.com, skip-cert-verify: false}
  - {name: TJ-W, type: trojan, server: t3.example.com, port: 443, password: pw, udp: true, skip-cert-verify: false, sni: t3.example.com, network: ws, ws-opts: {path: /ws, headers: {Host: t3.example.com}}}
proxy-groups:
  - {name: PROXY, type: select, proxies: [TJ-A, TJ-B, TJ-W]}
