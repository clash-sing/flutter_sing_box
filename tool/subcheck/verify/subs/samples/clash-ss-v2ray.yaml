proxies:
  - {name: TJ-A, type: trojan, server: t1.example.com, port: 443, password: pw, sni: t1.example.com, skip-cert-verify: false}
  - {name: TJ-B, type: trojan, server: t2.example.com, port: 443, password: pw, sni: t2.example.com, skip-cert-verify: false}
  - {name: SS-V2, type: ss, server: s1.example.com, port: 443, cipher: aes-128-gcm, password: pw, udp: true, plugin: v2ray-plugin, plugin-opts: {mode: websocket, tls: true, host: s1.example.com, path: /, headers: {Host: s1.example.com}}}
proxy-groups:
  - {name: PROXY, type: select, proxies: [TJ-A, TJ-B, SS-V2]}
